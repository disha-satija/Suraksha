name: suraksha
description: Offline-first women safety app with on-device AI scoring.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management (MVVM)
  provider: ^6.1.2

  # Map rendering (offline-first)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # On-device ONNX inference
  onnxruntime: ^1.4.1

  # Local database (SQLite)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0

  # Supabase cloud sync
  supabase_flutter: ^2.5.3

  # Connectivity detection
  connectivity_plus: ^6.0.3

  # SMS + URL launching (guardian fallback)
  url_launcher: ^6.3.0

  # HTTP (OSRM routing calls)
  http: ^1.2.1

  # GPS location
  geolocator: ^13.0.1

  # Shared preferences (settings storage)
  shared_preferences: ^2.3.1

  # UI utilities
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true

  assets:
    - assets/model/safety_model.onnx
    - assets/model/model_weights.json
    - assets/data/safety_grid.json
    - assets/data/demo_routes.json
